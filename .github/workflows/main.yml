name: Build Atmosphere

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (nx_release, libnx master)
    runs-on: ubuntu-latest

    env:
      ATMOSPHERE_OUT: out/nintendo_nx_arm64_armv8a/release
      # Every build step runs in a fresh container with the freshly built
      # libnx master mounted over the image's /opt/devkitpro/libnx.
      # GIT_CONFIG_* marks the (runner-owned) workspace as safe for root's git,
      # which the build uses to derive its version string.
      DOCKER_RUN: >-
        docker run --rm
        -v ${{ github.workspace }}:/workspace
        -v /tmp/libnx-install:/opt/devkitpro/libnx
        -w /workspace
        -e GIT_CONFIG_COUNT=1
        -e GIT_CONFIG_KEY_0=safe.directory
        -e GIT_CONFIG_VALUE_0=*
        ams-builder

    steps:
      - name: Checkout Atmosphere
        uses: actions/checkout@v7

      # The build calls `git symbolic-ref HEAD`, which fails on a detached HEAD
      # (e.g. pull_request merge commits). Put HEAD on a named local branch.
      - name: Prepare git metadata
        run: |
          if ! git symbolic-ref -q HEAD >/dev/null; then
            git checkout -B "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          fi

      # Newest devkitA64 image plus the few extra packages the build scripts need
      # (no dkp-pacman: pkg.devkitpro.org returns 403 to CI runners).
      - name: Prepare build image
        run: |
          docker pull devkitpro/devkita64:latest
          docker build -t ams-builder - <<'EOF'
          FROM devkitpro/devkita64:latest
          RUN apt-get update && \
              apt-get install -y --no-install-recommends git zip python3 python3-lz4 && \
              ln -sf /usr/bin/python3 /usr/local/bin/python && \
              rm -rf /var/lib/apt/lists/*
          EOF

      - name: Clone libnx (master)
        run: |
          git clone --depth 1 https://github.com/switchbrew/libnx.git /tmp/libnx-src
          echo "libnx commit: $(git -C /tmp/libnx-src rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/libnx-install

      - name: Build and install libnx
        run: |
          docker run --rm \
            -v /tmp/libnx-src:/libnx-src \
            -v /tmp/libnx-install:/libnx-out \
            -w /libnx-src \
            ams-builder \
            bash -c 'make -j$(nproc) install && cp -a "$DEVKITPRO/libnx/." /libnx-out/'

      # troposphere apps (daybreak, haze) race under -j: the inner build/ make
      # links the .nro before uam has produced the romfs shaders. Build serially.
      - name: Build troposphere (serial)
        run: $DOCKER_RUN make -C troposphere -j1 all

      - name: Build Atmosphere
        run: |
          $DOCKER_RUN make -j"$(nproc)"
          sudo chown -R "$(id -u):$(id -g)" . # files created by the container's root user

      - name: Collect stratosphere KIPs
        run: |
          mkdir -p /tmp/kips
          find stratosphere -path "*/${ATMOSPHERE_OUT}/*.kip" -exec cp -v {} /tmp/kips/ \;
          test -n "$(ls -A /tmp/kips)" || { echo "No KIP files found"; exit 1; }
          ls -l /tmp/kips

      - name: Upload Atmosphere build output
        uses: actions/upload-artifact@v7
        with:
          name: atmosphere-${{ github.sha }}
          path: ${{ env.ATMOSPHERE_OUT }}/*
          if-no-files-found: error

      - name: Upload stratosphere KIPs
        uses: actions/upload-artifact@v7
        with:
          name: stratosphere-kips-${{ github.sha }}
          path: /tmp/kips/*.kip
          if-no-files-found: error
